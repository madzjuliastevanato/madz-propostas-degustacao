<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MADZ — Apresentador de Propostas</title>
  <link rel="stylesheet" href="css/estilo.css">
  <link rel="stylesheet" href="css/impressao.css">
</head>
<body>
  <header class="cabecalho">
    <div class="cabecalho-linha-topo">
      <div class="cabecalho-marca">
        <img src="assets/logo_madz_branco_transparente.png" alt="MADZ Eventos">
      </div>
      <div class="cabecalho-acoes">
        <button type="button" id="botao-abrir-bemvindos">Abrir tela de Bem-Vindos</button>
        <button type="button" id="botao-espelhar">Espelhar apresentação</button>
        <button type="button" id="botao-propostas-salvas">Propostas salvas</button>
        <button type="button" id="botao-exportar-pdf" class="botao-principal">Exportar PDF</button>
      </div>
    </div>
    <div class="cabecalho-campos">
      <div class="campo-casal">
        <label for="campo-nome-casal">Nome do casal</label>
        <input type="text" id="campo-nome-casal" placeholder="Ex.: Catharina &amp; Gabriel">
      </div>
      <div>
        <label for="campo-data-evento">Data do evento</label>
        <input type="date" id="campo-data-evento">
      </div>
      <div>
        <label for="campo-local">Local</label>
        <input type="text" id="campo-local">
      </div>
      <div>
        <label for="campo-tempo-servico">Tempo de serviço (h)</label>
        <input type="number" id="campo-tempo-servico" min="1" step="0.5">
      </div>
      <div>
        <label for="campo-convidados">Nº de convidados</label>
        <input type="number" id="campo-convidados" min="0" step="1">
      </div>
      <div>
        <label for="campo-assessoria">Assessoria</label>
        <input type="text" id="campo-assessoria">
      </div>
      <div>
        <label for="campo-data-fechamento">Data de fechamento</label>
        <input type="date" id="campo-data-fechamento">
      </div>
      <div>
        <label for="campo-validade-proposta">Validade da proposta</label>
        <input type="date" id="campo-validade-proposta">
      </div>
    </div>
  </header>

  <nav class="abas-navegacao">
    <button type="button" class="aba-botao ativa" data-aba="pacotes">Pacotes</button>
    <button type="button" class="aba-botao" data-aba="adicionais">Adicionais</button>
    <button type="button" class="aba-botao" data-aba="resumo">Resumo</button>
  </nav>

  <main>
    <div class="aba-conteudo" id="aba-pacotes">
      <section class="pacote" id="secao-drinks-caipirinhas"></section>
      <section class="pacote" id="pacote-signature"></section>
      <section class="pacote" id="pacote-elegance"></section>
      <section class="pacote" id="pacote-select"></section>
    </div>
    <div class="aba-conteudo oculto" id="aba-adicionais"></div>
    <div class="aba-conteudo oculto" id="aba-resumo"></div>
  </main>

  <div id="area-impressao"></div>

  <div class="modal-fundo oculto" id="modal-propostas">
    <div class="modal-caixa">
      <div class="modal-caixa-cabecalho">
        <h3 style="margin:0;">Propostas salvas</h3>
        <div style="display:flex; gap:0.5rem;">
          <button type="button" id="botao-nova-proposta">Nova proposta</button>
          <button type="button" class="botao-discreto" id="botao-fechar-propostas" title="Fechar">✕</button>
        </div>
      </div>
      <div id="lista-propostas-salvas"></div>
    </div>
  </div>

  <datalist id="catalogo-adicionais"></datalist>
  <div class="aviso-salvamento" id="aviso-salvamento"></div>

  <script src="js/config.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/state.js"></script>
  <script src="js/proposta.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
